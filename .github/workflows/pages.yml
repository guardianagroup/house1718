name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # (24 nov 2026: los prototipos de diseño se quedan en el repositorio, pero no se publican en la web)
      - run: |
          mkdir _sitio
          cp -a $(ls -A | grep -vE '^(\.git|\.github|_sitio|prototipos|prototipo-.*\.html)$') _sitio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      # (23 nov 2026: GitHub tardaba en listar el paquete recién subido y el despliegue fallaba con «Found 0 artifact(s)»)
      - run: sleep 25
      - id: deployment
        uses: actions/deploy-pages@v4
